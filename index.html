<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10232b" />
    <meta name="description" content="Интерактивный 30-минутный пробный урок Quest English для преподавателя." />
    <title>Quest English | Trial lesson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Quest English">
        <span class="brand-mark" aria-hidden="true">★</span>
        <span>QUEST<br /><em>ENGLISH</em></span>
      </a>
    </header>

    <main class="app-shell" id="top">
      <section class="hero" aria-labelledby="pageTitle">
        <div class="hero-copy">
          <p class="eyebrow">WELCOME, TEACHER / РАСШИРЕННЫЙ ПРОБНЫЙ УРОК</p>
          <h1 id="pageTitle">Find your <span>English superpower</span></h1>
          <p class="hero-sub">Диагностический квест на 30 минут. Соберите живой профиль ученика по его ответам.</p>
          <button class="primary-btn" id="startBtn" type="button">START THE QUEST <span aria-hidden="true">↗</span></button>
        </div>
        <div class="hero-orbit" aria-hidden="true">
          <div class="orbit-card">LEVEL<br /><strong>UP!</strong></div>
          <div class="orbit-star">✦</div>
          <div class="orbit-ring"></div>
        </div>
      </section>

      <section class="workspace lesson-only" id="workspace" aria-label="Консоль пробного урока">
        <div class="lesson-column">
          <div class="workspace-tools">
            <label class="photo-control" for="photoInput">
              <span class="photo-preview" id="photoPreview" aria-hidden="true">+</span>
              <span class="photo-control-copy">
                <strong>PHOTO BOOST</strong>
                <small>Фото ученика необязательно</small>
              </span>
              <span class="photo-file-name" id="photoFileName">Добавить фото</span>
              <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" />
            </label>
            <button class="quiet-btn" id="newStudentBtn" type="button">NEW STUDENT</button>
          </div>

          <div class="progress-row" aria-label="Прогресс урока">
            <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
            <span class="tabular-nums" id="progressLabel">1 / 7</span>
          </div>

          <div class="lesson-card" id="lessonCard" aria-live="polite"></div>

          <div class="lesson-nav">
            <button class="ghost-btn" id="prevBtn" type="button">← BACK</button>
            <button class="primary-btn small" id="nextBtn" type="button">NEXT MISSION <span aria-hidden="true">→</span></button>
          </div>
          <p class="status-message" id="appStatus" role="status" aria-live="polite"></p>
        </div>

        <section class="dossier" id="dossier" aria-labelledby="dossierTitle" hidden></section>
      </section>
    </main>

    <footer>
      <span>QUEST ENGLISH / teacher console</span>
      <span>Built for brave beginners</span>
    </footer>

    <span id="currentTime" hidden>4 MIN</span>
    <script src="app.js"></script>
    <script src="interactions.js"></script>
  </body>
</html>
